apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudcart-bastion-portforward
  namespace: cloudcart
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudcart-bastion-portforward
  namespace: cloudcart
subjects:
  - kind: Group
    name: cloudcart-bastion-access
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudcart-bastion-portforward
  apiGroup: rbac.authorization.k8s.io
