apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudcart-mysql
  namespace: cloudcart
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm-store
    kind: ClusterSecretStore
  target:
    name: cloudcart-mysql-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /cloudcart/production/mysql-ec2/host
    - secretKey: DB_PORT
      remoteRef:
        key: /cloudcart/production/mysql-ec2/port
    - secretKey: DB_NAME
      remoteRef:
        key: /cloudcart/production/mysql-ec2/database
    - secretKey: DB_USERNAME
      remoteRef:
        key: /cloudcart/production/mysql-ec2/username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /cloudcart/production/mysql-ec2/password
